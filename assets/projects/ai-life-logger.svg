<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="ll-title ll-desc">
  <title id="ll-title">AI Life Logger pipeline</title>
  <desc id="ll-desc">Audio captured on Ray-Ban glasses is transcribed, filtered, summarized, stored, and delivered as an hourly digest.</desc>
  <rect width="640" height="420" fill="#EADCC4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="34" y="60" width="128" height="76" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="98" y="94" fill="#211C18" font-size="13" font-weight="700">Ray-Ban</text>
    <text x="98" y="111" fill="#211C18" font-size="13" font-weight="700">audio capture</text>
    <path d="M162 98h40" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrow)"/>
    <rect x="202" y="60" width="128" height="76" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="266" y="94" fill="#211C18" font-size="13" font-weight="700">Filesystem</text>
    <text x="266" y="111" fill="#211C18" font-size="13" font-weight="700">watcher</text>
    <path d="M330 98h40" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrow)"/>
    <rect x="370" y="60" width="128" height="76" rx="8" fill="#F0DCBE" stroke="#8F4610" stroke-width="2"/>
    <text x="434" y="94" fill="#211C18" font-size="13" font-weight="700">Whisper</text>
    <text x="434" y="111" fill="#8F4610" font-size="12">transcription</text>
    <path d="M498 98h40" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrow)"/>
    <rect x="538" y="60" width="68" height="76" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="572" y="94" fill="#211C18" font-size="12" font-weight="700">Filter</text>
    <text x="572" y="111" fill="#211C18" font-size="12" font-weight="700">dedup</text>
    <path d="M572 136v24M572 160H434v24" fill="none" stroke="#C7B59A" stroke-width="2"/>
    <path d="M434 220v0" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrow)"/>
    <rect x="370" y="220" width="128" height="76" rx="8" fill="#211C18"/>
    <text x="434" y="254" fill="#F7F0E3" font-size="13" font-weight="700">Claude</text>
    <text x="434" y="271" fill="#E8D2AC" font-size="12">summarization</text>
    <path d="M370 258h-40" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrowL)"/>
    <rect x="202" y="220" width="128" height="76" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="266" y="254" fill="#211C18" font-size="13" font-weight="700">SQLite</text>
    <text x="266" y="271" fill="#211C18" font-size="12">persistence</text>
    <path d="M202 258h-40" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#llArrowL)"/>
    <rect x="34" y="220" width="128" height="76" rx="8" fill="#8F4610"/>
    <text x="98" y="254" fill="#F2E8D8" font-size="13" font-weight="700">Telegram</text>
    <text x="98" y="271" fill="#F0DCBE" font-size="12">hourly digest</text>
    <g font-size="11" fill="#6B5440">
      <text x="320" y="340">retries · quiet hours · duplicate-write guards</text>
    </g>
  </g>
  <defs>
    <marker id="llArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l7 4-7 4z" fill="#C7B59A"/></marker>
    <marker id="llArrowL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto-start-reverse"><path d="M0 0l7 4-7 4z" fill="#C7B59A"/></marker>
  </defs>
</svg>
