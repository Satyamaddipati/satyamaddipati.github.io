<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="rg-title rg-desc">
  <title id="rg-title">Reason-Guessr inference pipeline</title>
  <desc id="rg-desc">A street-level image passes through a CLIP encoder into a visual embedding, fuses with interpretable cues, and regresses to coordinates.</desc>
  <rect width="640" height="420" fill="#EADCC4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="34" y="150" width="118" height="80" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="93" y="186" fill="#211C18" font-size="14" font-weight="700">Street-level</text>
    <text x="93" y="204" fill="#211C18" font-size="14" font-weight="700">image</text>
    <path d="M152 190h44" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#rgArrow)"/>
    <rect x="196" y="150" width="118" height="80" rx="8" fill="#F0DCBE" stroke="#8F4610" stroke-width="2"/>
    <text x="255" y="186" fill="#211C18" font-size="14" font-weight="700">CLIP</text>
    <text x="255" y="204" fill="#8F4610" font-size="12">ViT-B/32 encoder</text>
    <path d="M314 190h44" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#rgArrow)"/>
    <rect x="358" y="150" width="118" height="80" rx="8" fill="#F7F0E3" stroke="#C7B59A" stroke-width="2"/>
    <text x="417" y="186" fill="#211C18" font-size="14" font-weight="700">Visual</text>
    <text x="417" y="204" fill="#211C18" font-size="14" font-weight="700">embedding</text>
    <path d="M476 190h44" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#rgArrow)"/>
    <rect x="520" y="150" width="90" height="80" rx="8" fill="#211C18"/>
    <text x="565" y="183" fill="#F7F0E3" font-size="13" font-weight="700">Cue</text>
    <text x="565" y="200" fill="#F7F0E3" font-size="13" font-weight="700">fusion</text>
    <path d="M417 230v34M417 264h148" fill="none" stroke="#C7B59A" stroke-width="2"/>
    <path d="M565 230v34" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#rgArrow)"/>
    <g font-size="11" fill="#8F4610">
      <rect x="34" y="278" width="110" height="34" rx="6" fill="#F0DCBE"/>
      <text x="89" y="299">climate</text>
      <rect x="156" y="278" width="110" height="34" rx="6" fill="#F0DCBE"/>
      <text x="211" y="299">plates</text>
      <rect x="278" y="278" width="110" height="34" rx="6" fill="#F0DCBE"/>
      <text x="333" y="299">vegetation</text>
      <rect x="400" y="278" width="128" height="34" rx="6" fill="#F0DCBE"/>
      <text x="464" y="299">architecture</text>
    </g>
    <path d="M89 278v-14h328v-10" fill="none" stroke="#C7B59A" stroke-width="2"/>
    <path d="M320 312v16" fill="none" stroke="#C7B59A" stroke-width="2" marker-end="url(#rgArrow)"/>
    <rect x="235" y="332" width="170" height="58" rx="8" fill="#8F4610"/>
    <text x="320" y="356" fill="#F2E8D8" font-size="14" font-weight="700">Coordinate</text>
    <text x="320" y="375" fill="#F0DCBE" font-size="12">regression → lat, long</text>
  </g>
  <defs>
    <marker id="rgArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0l7 4-7 4z" fill="#C7B59A"/>
    </marker>
  </defs>
</svg>
